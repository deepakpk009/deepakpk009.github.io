<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#7b4538" />
    <meta name="description" content="A private, offline calendar saved only on this device." />
    <meta name="color-scheme" content="dark" />
    <link rel="manifest" href="./manifest.webmanifest" />
    <link rel="icon" href="./assets/favicon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="./assets/icons/icon-192.png" />
    <link rel="stylesheet" href="./src/styles.css?v=3" />
    <title>Cozy Calendar</title>
  </head>
  <body>
    <main class="app-shell">
      <section class="calendar-card" aria-labelledby="month-heading">
        <header class="topbar">
          <div class="brand-block">
            <span class="brand-mark" aria-hidden="true">
              <svg viewBox="0 0 24 24"><path d="M7 2v3M17 2v3M3.5 9h17M5.5 4h13a2 2 0 0 1 2 2v13a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z"/><path d="M8 13h.01M12 13h.01M16 13h.01M8 17h.01M12 17h.01"/></svg>
            </span>
            <div>
              <p class="eyebrow">My calendar</p>
              <h1 id="month-heading">Calendar</h1>
            </div>
          </div>
          <div class="top-actions">
            <button class="icon-button" id="search-toggle" type="button" aria-label="Search events" aria-expanded="false">
              <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
            </button>
            <button class="today-button" id="today-button" type="button" aria-label="Go to today">
              <span id="today-number">16</span>
            </button>
          </div>
        </header>

        <form class="search-panel" id="search-form" role="search" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="6.5"/><path d="m16 16 4 4"/></svg>
          <label class="sr-only" for="search-input">Search event titles and notes</label>
          <input id="search-input" type="search" placeholder="Search events…" autocomplete="off" />
          <button id="search-close" type="button" aria-label="Close search">×</button>
        </form>

        <div class="month-navigation">
          <button class="nav-button" id="previous-month" type="button" aria-label="Previous month">‹</button>
          <p class="month-label" id="month-label" aria-live="polite"></p>
          <button class="nav-button" id="next-month" type="button" aria-label="Next month">›</button>
        </div>

        <div class="weekday-row" aria-hidden="true">
          <span>Mon</span><span>Tue</span><span>Wed</span><span>Thu</span><span>Fri</span><span>Sat</span><span>Sun</span>
        </div>
        <div class="calendar-grid" id="calendar-grid" role="grid" aria-label="Month calendar"></div>

        <section class="agenda" aria-labelledby="selected-date-heading">
          <header class="agenda-header">
            <div>
              <p class="agenda-kicker">Schedule</p>
              <h2 id="selected-date-heading"></h2>
            </div>
            <span class="event-count" id="event-count"></span>
          </header>

          <p class="storage-warning" id="storage-warning" role="status" hidden>
            Events work for this session, but this browser is not allowing them to be saved.
          </p>

          <div class="search-results" id="search-results" hidden></div>
          <div class="event-list" id="event-list"></div>
          <div class="empty-state" id="empty-state">
            <span aria-hidden="true">✦</span>
            <p>No plans yet</p>
            <small>Add something lovely to this day.</small>
          </div>
        </section>

        <button class="add-event-button" id="add-event" type="button">
          <span id="add-event-label">Add event</span>
          <span class="plus" aria-hidden="true">+</span>
        </button>

        <footer class="utility-bar">
          <button class="utility-button" id="install-button" type="button" hidden>Install app</button>
          <button class="utility-button" id="update-button" type="button" hidden>Update available</button>
          <span>Saved only on this device</span>
        </footer>
      </section>
    </main>

    <dialog class="event-dialog" id="event-dialog" aria-labelledby="event-dialog-title">
      <form id="event-form">
        <div class="dialog-heading">
          <div>
            <p class="eyebrow">Plan your day</p>
            <h2 id="event-dialog-title">Add event</h2>
          </div>
          <button class="close-button" id="event-close" type="button" aria-label="Close event form">×</button>
        </div>

        <input id="event-id" type="hidden" />
        <label class="field">
          <span>Title</span>
          <input id="event-title" type="text" maxlength="80" required placeholder="What’s happening?" autocomplete="off" />
        </label>
        <label class="field">
          <span>Date</span>
          <input id="event-date" type="date" required />
        </label>

        <label class="switch-row">
          <span><strong>All day</strong><small>Keep the event free of a specific time</small></span>
          <input id="event-all-day" type="checkbox" checked />
        </label>

        <div class="time-fields" id="time-fields" hidden>
          <label class="field"><span>Starts</span><input id="event-start" type="time" /></label>
          <label class="field"><span>Ends</span><input id="event-end" type="time" /></label>
        </div>

        <fieldset class="color-field">
          <legend>Color</legend>
          <div class="color-options">
            <label><input type="radio" name="event-color" value="sage" checked /><span class="sage">Sage</span></label>
            <label><input type="radio" name="event-color" value="sunset" /><span class="sunset">Sunset</span></label>
            <label><input type="radio" name="event-color" value="sky" /><span class="sky">Sky</span></label>
            <label><input type="radio" name="event-color" value="plum" /><span class="plum">Plum</span></label>
          </div>
        </fieldset>

        <label class="field">
          <span>Notes <small>Optional</small></span>
          <textarea id="event-notes" maxlength="300" rows="3" placeholder="Add a little detail…"></textarea>
        </label>

        <p class="form-error" id="form-error" role="alert" hidden></p>
        <div class="dialog-actions">
          <button class="delete-button" id="delete-event" type="button" hidden>Delete</button>
          <span class="action-spacer"></span>
          <button class="secondary-button" id="event-cancel" type="button">Cancel</button>
          <button class="save-button" type="submit">Save event</button>
        </div>
      </form>
    </dialog>

    <div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true" hidden></div>
    <div class="sr-only" id="announcer" aria-live="polite" aria-atomic="true"></div>
    <script type="module" src="./src/app.js?v=4"></script>
  </body>
</html>
